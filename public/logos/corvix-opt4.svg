<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="opt4_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="opt4_emerald_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="opt4_obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="opt4_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#opt4_shadow)">
    <!-- Primary Top Left Fold -->
    <path d="M 120 160 L 256 80 L 256 180 L 170 230 Z" fill="url(#opt4_obsidian)"/>
    
    <!-- Primary Top Right Fold -->
    <path d="M 392 160 L 256 80 L 256 180 L 342 230 Z" fill="url(#opt4_emerald)"/>

    <!-- Left Angular Beam -->
    <path d="M 120 160 L 170 230 L 170 350 L 120 320 Z" fill="url(#opt4_emerald_light)"/>

    <!-- Right Angular Beam -->
    <path d="M 392 160 L 342 230 L 342 350 L 392 320 Z" fill="url(#opt4_obsidian)"/>

    <!-- Bottom Center Convergence -->
    <path d="M 256 432 L 170 350 L 256 300 L 342 350 Z" fill="url(#opt4_emerald)"/>

    <!-- Precision Floating Center Spark -->
    <polygon points="256,220 286,256 256,292 226,256" fill="#ffffff"/>
  </g>
</svg>
